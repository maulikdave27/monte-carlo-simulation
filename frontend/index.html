<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Risk Intelligence</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Load Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Load Marked for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <header>
        <h1>Portfolio Risk Intelligence</h1>
        <p class="subtitle">Institutional Grade Risk Assessment & AI Optimization</p>
    </header>

    <main class="container">
        <!-- Settings Panel -->
        <section class="settings-panel">
            <h2>Simulation Settings</h2>
            <form id="auditForm">
                <div class="form-group">
                    <label for="timeHorizon">Investment Horizon</label>
                    <select id="timeHorizon" name="timeHorizon">
                        <option value="1-3 years">1-3 years (Short Term)</option>
                        <option value="3-6 years" selected>3-6 years (Medium Term)</option>
                        <option value="6+ years">6+ years (Long Term)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="riskPreference">Risk Preference</label>
                    <select id="riskPreference" name="riskPreference">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High" selected>High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numSimulations">Number of Simulations</label>
                    <div class="slider-container">
                        <input type="range" id="numSimulations" name="numSimulations" min="1000000" max="4000000"
                            step="100000" value="1000000">
                        <span id="simValue">1,000,000</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Input Method</label>
                    <div class="radio-group">
                        <label><input type="radio" name="inputMethod" value="manual" checked> Manual Test</label>
                        <label><input type="radio" name="inputMethod" value="upload"> File Upload</label>
                    </div>
                </div>

                <!-- Manual Input Area -->
                <div id="manualInputSection" class="input-section">
                    <p>Testing with default Tech/Finance biased portfolio (AAPL, JPM, XOM, NVDA, MSFT, GOOGL, AMZN).</p>
                </div>

                <!-- File Upload Area -->
                <div id="fileUploadSection" class="input-section hidden">
                    <input type="file" id="portfolioFile" accept=".csv, .xlsx">
                </div>

                <button type="submit" id="runBtn" class="primary-btn">Run Risk Analysis</button>
            </form>
        </section>

        <!-- Results Dashboard -->
        <section id="resultsDashboard" class="hidden">
            <hr>

            <!-- Metrics Grid -->
            <div class="metrics-container">
                <div class="metric-card user-card">
                    <h3>Your Portfolio</h3>
                    <div id="userMetrics" class="metric-list"></div>
                </div>
                <div class="metric-card optimal-card">
                    <h3>AI Optimized</h3>
                    <div id="optimalMetrics" class="metric-list"></div>
                </div>
            </div>

            <!-- Charts -->
            <div class="visuals-tabs">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="showTab('frontier')">Efficiency Frontier</button>
                    <button class="tab-btn" onclick="showTab('allocation')">Asset Allocation</button>
                    <button class="tab-btn" onclick="showTab('sector')">Sector Analysis</button>
                </div>

                <div id="frontierTab" class="tab-content">
                    <div class="chart-box full">
                        <div id="frontierChart"></div>
                    </div>
                </div>

                <div id="allocationTab" class="tab-content hidden">
                    <div class="charts-container">
                        <div class="chart-box">
                            <h4 style="text-align: center;">Your Portfolio</h4>
                            <div id="userAllocationChart"></div>
                        </div>
                        <div class="chart-box">
                            <h4 style="text-align: center;">AI Optimized</h4>
                            <div id="optimalAllocationChart"></div>
                        </div>
                    </div>
                </div>

                <div id="sectorTab" class="tab-content hidden">
                    <div class="chart-box full">
                        <div id="sectorChart"></div>
                    </div>
                </div>
            </div>

            <hr>

            <!-- AI Insights -->
            <div class="ai-section">
                <button id="askAiBtn" class="secondary-btn">✨ Ask AI Specialist</button>
                <div id="aiResponse" class="ai-content hidden"></div>
            </div>

        </section>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
